<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c182b"><meta name="display-version" content="__DISPLAY_VERSION__">
<title>Leaderboard · Joy Factory Through The Night</title>
<link rel="stylesheet" href="/leaderboard.css?v=__DISPLAY_VERSION__">
<link rel="stylesheet" href="/christmas.css?v=__DISPLAY_VERSION__">
<script src="/motion.js?v=__DISPLAY_VERSION__" defer></script>
<script src="/leaderboard.js?v=__DISPLAY_VERSION__" defer></script>
</head><body data-health="connecting">
<main class="joy-stage">
<div class="night-scene" aria-hidden="true">
  <div class="winter-aurora"><i></i><i></i></div>
  <div class="palace-frame"></div>
  <div class="velvet-canopy"><i></i><i></i></div>
  <div class="hanging-ornament ornament-one" data-motion-toy="bauble"><img src="/assets/joy-bauble.svg" alt=""></div>
  <div class="hanging-ornament ornament-two" data-motion-toy="bauble"><img src="/assets/joy-bauble.svg" alt=""></div>
  <div class="constellation-tree constellation-left"></div>
  <div class="constellation-tree constellation-right"></div>
  <div class="golden-bokeh" id="golden-bokeh"></div>
  <div class="silk-ribbons"><i></i><i></i><i></i></div>
  <div class="clockwork clockwork-left" data-motion-toy="clockwork"><img src="/assets/joy-clockwork.svg" alt=""></div>
  <div class="clockwork clockwork-right" data-motion-toy="clockwork"><img src="/assets/joy-clockwork.svg" alt=""></div>
  <div class="workshop-skyline" data-motion-toy="workshop"><img src="/assets/joy-workshop.svg" alt=""></div>
  <div class="motion-beams" aria-hidden="true"><i></i><i></i></div>
  <div class="festival-garland" id="festival-garland"></div>
  <div class="festival-stars" id="festival-stars"></div>
  <div class="winter-snow" id="winter-snow"></div>
  <div class="magic-trails"><i></i><i></i><i></i></div>
  <div class="celebration-layer" id="celebration-layer"></div>
</div>
<header class="display-header">
  <div class="display-title"><span class="factory-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8m0-12.8L5.6 18.4" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg></span><h1>LEADERBOARD</h1></div>
  <div class="header-end">
    <section class="countdown" id="collection-timer" aria-label="Sisa waktu pengumpulan struk" hidden>
      <span id="timer-title" class="sr-only">Sisa waktu pengumpulan struk</span>
      <span id="timer-deadline" class="sr-only"></span><span id="timer-note" class="sr-only"></span>
      <div class="clock" role="timer" aria-live="off" id="collection-clock">
        <span class="clock-unit"><b id="timer-days">00</b><small>H</small></span>
        <span class="clock-unit"><b id="timer-hours">00</b><small>J</small></span>
        <span class="clock-unit"><b id="timer-minutes">00</b><small>M</small></span>
        <span class="clock-unit"><b id="timer-seconds">00</b><small>D</small></span>
      </div><span id="closed-label" hidden>DITUTUP</span>
    </section>
    <span class="connection-dot" id="connection-indicator" role="img" aria-label="Menghubungkan"></span>
    <span id="connection-status" class="sr-only" role="status">MENGHUBUNGKAN</span>
  </div>
  <div class="display-tools" id="display-tools" hidden>
    <button type="button" id="motion-toggle" aria-pressed="false">Jeda animasi</button>
    <button type="button" id="screen-toggle">Layar penuh</button>
    <button type="button" id="sequence-replay">Putar sequence</button>
  </div>
</header>
<p class="display-alert" id="display-alert" role="status" hidden></p>
<p id="empty-state" class="empty-state" hidden><span class="empty-art" data-motion-toy="gifts" aria-hidden="true"></span>Belum ada poin</p>
<section class="board-grid leaderboard-layout" aria-label="Peringkat poin pelanggan">
  <div class="podium" id="podium" aria-label="Tiga peringkat teratas"></div>
  <div class="table-wrap" hidden><table aria-label="Peringkat 4 sampai 10">
    <thead><tr><th scope="col">#</th><th scope="col">Nama</th><th scope="col">Member</th><th scope="col">Poin</th></tr></thead>
    <tbody id="rankings"></tbody>
  </table></div>
</section>
<div class="festival-footer" aria-hidden="true">
  <div class="workshop-glow"></div>
  <img class="factory-parade" src="/assets/joy-bear-factory.png" width="2172" height="724" alt="" decoding="async">
  <div class="atelier-piece atelier-bear"><div class="sculpture-halo"></div><div class="toy-figure" data-motion-toy="bear"></div></div>
  <div class="atelier-piece atelier-globe"><div class="sculpture-halo"></div><div class="toy-figure" data-motion-toy="globe"></div><div class="crystal-glints"><i></i><i></i><i></i></div></div>
</div>
<span id="last-update" class="sr-only"></span>
</main></body></html>
